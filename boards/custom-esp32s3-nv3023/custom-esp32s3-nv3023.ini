[env:custom-esp32s3-nv3023]
board = custom-esp32s3-nv3023
board_build.arduino.memory_type = qio_qspi
board_build.partitions = custom_16Mb.csv
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_src_filter = ${env.build_src_filter} +<../boards/custom-esp32s3-nv3023>
build_flags =
	${env.build_flags}
	-Iboards/custom-esp32s3-nv3023
	-DCUSTOM_ESP32S3_NV3023
	-DBOARD_HAS_PSRAM
	-DUSE_ARDUINO_GFX
	-DHAS_TOUCH=1
	-DTOUCH_CST816S_I2C=1
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-Wno-deprecated-declarations
	-Wno-narrowing
lib_deps =
	${env.lib_deps}
	moononournation/GFX Library for Arduino @ ^1.5.5
